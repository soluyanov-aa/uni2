<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ЮНИЛАБ — Галерея тем</title>

    <!-- Preload ALL fonts used by any theme -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Anton&family=Space+Mono:wght@400;700&family=Inter:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&family=Nunito:wght@400;600;700;800;900&family=Quicksand:wght@400;500;600;700&family=Orbitron:wght@400;500;700;900&family=Rajdhani:wght@300;400;500;600;700&family=Share+Tech+Mono&family=Outfit:wght@300;400;500;600;700;800;900&family=Manrope:wght@300;400;500;600;700;800&family=Rubik:wght@400;500;600;700&family=Roboto:wght@300;400;500;700&family=Montserrat:wght@200;300;400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="css/gallery.css">
</head>
<body>

<!-- ============ GALLERY TOOLBAR ============ -->
<header class="gallery-bar" id="galleryBar">
    <div class="gallery-bar__left">
        <div class="gallery-bar__logo">ЮНИЛАБ</div>
        <span class="gallery-bar__sep"></span>
        <span class="gallery-bar__label">Галерея тем</span>
    </div>

    <nav class="gallery-bar__themes" id="themeSwitcher">
        <!-- buttons injected by JS -->
    </nav>

    <div class="gallery-bar__right">
        <button class="gallery-bar__btn" id="prevTheme" title="Предыдущая тема (←)">◀</button>
        <span class="gallery-bar__counter" id="themeCounter">1 / 8</span>
        <button class="gallery-bar__btn" id="nextTheme" title="Следующая тема (→)">▶</button>
        <span class="gallery-bar__sep"></span>
        <button class="gallery-bar__btn gallery-bar__btn--expand" id="openFullscreen" title="Открыть в новом окне">↗</button>
        <button class="gallery-bar__btn" id="toggleBar" title="Свернуть панель">▾</button>
    </div>
</header>

<!-- Collapsed bar (floating mini-button) -->
<button class="gallery-mini" id="galleryMini" style="display:none">
    🎨 <span id="miniThemeName">Modern Clean</span>
</button>

<!-- ============ THEME IFRAME ============ -->
<main class="gallery-stage">
    <iframe id="themeFrame" src="about:blank" title="Предпросмотр темы"></iframe>
</main>

<script>
const THEMES = [
    { id: 'main',           name: 'Original',       desc: 'Базовая версия' },
    { id: 'modern-clean',   name: 'Modern Clean',   desc: 'Чистый Material Design' },
    { id: 'cyberpunk-mars', name: 'Cyberpunk Mars', desc: 'Киберпанк, красный неон' },
    { id: 'tesla-ui',       name: 'Tesla UI',       desc: 'Интерфейс управления Tesla' },
    { id: 'aurora-glass',   name: 'Aurora Glass',   desc: 'Glassmorphism, аврора' },
    { id: 'brutalist',      name: 'Brutalist',      desc: 'Нео-брутализм' },
    { id: 'neumorphic',     name: 'Neumorphic',     desc: 'Soft UI, неоморфизм' },
    { id: 'supabase',       name: 'Supabase',       desc: 'Dev dashboard эстетика' },
];

const STORAGE_KEY = 'unilab-gallery-theme';
let currentIndex = 0;

// ── Init ──
(function init() {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
        const idx = THEMES.findIndex(t => t.id === saved);
        if (idx >= 0) currentIndex = idx;
    }

    buildSwitcher();
    applyTheme(currentIndex);

    document.getElementById('prevTheme').addEventListener('click', () => switchBy(-1));
    document.getElementById('nextTheme').addEventListener('click', () => switchBy(1));
    document.getElementById('openFullscreen').addEventListener('click', openFullscreen);
    document.getElementById('toggleBar').addEventListener('click', collapseBar);
    document.getElementById('galleryMini').addEventListener('click', expandBar);

    document.addEventListener('keydown', e => {
        if (e.key === 'ArrowLeft')  switchBy(-1);
        if (e.key === 'ArrowRight') switchBy(1);
        if (e.key === ' ') {
            e.preventDefault();
            const bar = document.getElementById('galleryBar');
            if (bar.classList.contains('gallery-bar--hidden'))
                expandBar();
            else
                collapseBar();
        }
    });
})();

function buildSwitcher() {
    const container = document.getElementById('themeSwitcher');
    container.innerHTML = '';
    THEMES.forEach((theme, i) => {
        const btn = document.createElement('button');
        btn.className = 'theme-chip';
        btn.dataset.index = i;
        btn.title = theme.desc;
        btn.textContent = theme.name;
        btn.addEventListener('click', () => { currentIndex = i; applyTheme(i); });
        container.appendChild(btn);
    });
}

function applyTheme(index) {
    currentIndex = ((index % THEMES.length) + THEMES.length) % THEMES.length;
    const theme = THEMES[currentIndex];

    // Update iframe
    document.getElementById('themeFrame').src = 'themes/' + theme.id + '.html';

    // Update active chip
    document.querySelectorAll('.theme-chip').forEach((chip, i) => {
        chip.classList.toggle('theme-chip--active', i === currentIndex);
    });

    // Update counter
    document.getElementById('themeCounter').textContent =
        (currentIndex + 1) + ' / ' + THEMES.length;

    // Update mini button
    document.getElementById('miniThemeName').textContent = theme.name;

    // Save
    localStorage.setItem(STORAGE_KEY, theme.id);

    // Scroll active chip into view
    const activeChip = document.querySelector('.theme-chip--active');
    if (activeChip) activeChip.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
}

function switchBy(delta) {
    applyTheme(currentIndex + delta);
}

function openFullscreen() {
    const theme = THEMES[currentIndex];
    window.open('themes/' + theme.id + '.html', '_blank');
}

function collapseBar() {
    document.getElementById('galleryBar').classList.add('gallery-bar--hidden');
    document.getElementById('galleryMini').style.display = '';
}

function expandBar() {
    document.getElementById('galleryBar').classList.remove('gallery-bar--hidden');
    document.getElementById('galleryMini').style.display = 'none';
}
</script>
</body>
</html>
